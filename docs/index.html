<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베스트셀러 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1614;
  --paper: #f4ede2;
  --paper-deep: #ebe2d3;
  --accent: #c8451f;
  --accent-soft: #e8a890;
  --line: #2a221d;
  --muted: #7a6f63;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-weight: 400;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body {
  background-image:
    radial-gradient(rgba(42,34,29,0.04) 1px, transparent 1px);
  background-size: 4px 4px;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 48px 32px 96px; }

/* Masthead */
header.masthead {
  border-top: 6px solid var(--ink);
  border-bottom: 1px solid var(--line);
  padding: 24px 0 20px;
  margin-bottom: 36px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 24px;
}
.masthead h1 {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: clamp(40px, 6vw, 72px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  font-variation-settings: "opsz" 144;
}
.masthead h1 em {
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
}
.masthead .meta {
  text-align: right;
  font-size: 13px;
  color: var(--muted);
  font-feature-settings: "tnum";
  letter-spacing: 0.02em;
}
.masthead .meta b {
  display: block;
  color: var(--ink);
  font-size: 15px;
  font-weight: 600;
  margin-top: 2px;
}

/* Stats strip */
.stats {
  display: flex;
  gap: 0;
  border: 1px solid var(--line);
  background: var(--paper-deep);
  margin-bottom: 48px;
}
.stat {
  flex: 1;
  padding: 18px 22px;
  border-right: 1px solid var(--line);
}
.stat:last-child { border-right: none; }
.stat .label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat .value {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 600;
  font-feature-settings: "tnum";
  margin-top: 4px;
}

/* Section */
section { margin-bottom: 64px; }
.section-head {
  display: flex;
  align-items: baseline;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 24px;
}
.section-head h2 {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.section-head .kicker {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}
.section-head .note {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 16px;
  border-bottom: 2px solid var(--line);
}
.tab {
  padding: 10px 18px;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
  margin-bottom: -2px;
}
.tab.active {
  color: var(--ink);
  border-bottom-color: var(--accent);
}
.tab:hover:not(.active) { color: var(--ink); }

/* Book table */
.book-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0;
  border: 1px solid var(--line);
}
.book-row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 14px;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(42,34,29,0.12);
  align-items: center;
}
.book-row:nth-child(odd) { border-right: 1px solid var(--line); }
.book-row .rank {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  font-feature-settings: "tnum";
  color: var(--ink);
}
.book-row .rank.top { color: var(--accent); }
.book-row .info { min-width: 0; }
.book-row .title {
  font-weight: 500;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.book-row .meta-line {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.book-row .price {
  font-size: 12px;
  color: var(--muted);
  font-feature-settings: "tnum";
}

/* Common (3사 공통) */
.common-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--paper);
  border: 1px solid var(--line);
}
.common-table th, .common-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid rgba(42,34,29,0.1);
  font-size: 14px;
}
.common-table th {
  background: var(--ink);
  color: var(--paper);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.common-table td.rank-cell {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-feature-settings: "tnum";
  text-align: center;
  width: 60px;
}
.rank-pill {
  display: inline-block;
  min-width: 32px;
  padding: 2px 8px;
  background: var(--paper-deep);
  border: 1px solid var(--line);
  font-family: 'Fraunces', serif;
  font-feature-settings: "tnum";
  font-size: 14px;
  text-align: center;
}
.rank-pill.top10 { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.book-title-cell { font-weight: 500; }
.book-title-cell .author { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* Unique by store */
.unique-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.unique-col h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--ink);
}
.unique-col ol {
  list-style: none;
  counter-reset: u;
}
.unique-col li {
  counter-increment: u;
  padding: 8px 0;
  border-bottom: 1px dotted rgba(42,34,29,0.2);
  font-size: 13px;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 8px;
}
.unique-col li::before {
  content: "#" counter(u);
  font-family: 'Fraunces', serif;
  color: var(--muted);
  font-feature-settings: "tnum";
}
.unique-col .uauthor { color: var(--muted); font-size: 12px; }

/* Trend chart */
.trend-wrap {
  background: var(--paper-deep);
  border: 1px solid var(--line);
  padding: 24px;
  margin-top: 8px;
}
.trend-select {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}
.trend-chip {
  padding: 6px 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trend-chip:hover { background: var(--paper-deep); }
.trend-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#trendChart { width: 100%; height: 320px; }

/* Footer */
footer {
  margin-top: 80px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}

/* Empty state */
.empty {
  padding: 80px 24px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-style: italic;
}

@media (max-width: 820px) {
  .book-list { grid-template-columns: 1fr; }
  .book-row:nth-child(odd) { border-right: none; }
  .unique-grid { grid-template-columns: 1fr; }
  .masthead { grid-template-columns: 1fr; }
  .masthead .meta { text-align: left; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div>
    <h1>Bestseller <em>Almanac</em></h1>
  </div>
  <div class="meta">
    수집 기준일
    <b id="latestDate">—</b>
    <span style="margin-top:6px; display:block;" id="generatedAt"></span>
  </div>
</header>

<div class="stats" id="stats"></div>

<section id="overlap-section">
  <div class="section-head">
    <span class="kicker">01</span>
    <h2>3사 공통 상위권</h2>
    <span class="note">교보·예스24·알라딘 모두 100위 안에 등장한 책</span>
  </div>
  <div id="commonContainer"></div>
</section>

<section id="diff-section">
  <div class="section-head">
    <span class="kicker">02</span>
    <h2>서점별 단독 등장</h2>
    <span class="note">다른 두 서점 100위 밖, 한 서점에서만 등장한 책 상위 10권</span>
  </div>
  <div class="unique-grid" id="uniqueContainer"></div>
</section>

<section id="trend-section">
  <div class="section-head">
    <span class="kicker">03</span>
    <h2>순위 변동 추이</h2>
    <span class="note">최근 수집일 기준 — 책을 선택하면 일자별 순위가 그려집니다</span>
  </div>
  <div class="trend-wrap">
    <div class="trend-select" id="trendChips"></div>
    <canvas id="trendChart"></canvas>
  </div>
</section>

<section id="bystore-section">
  <div class="section-head">
    <span class="kicker">04</span>
    <h2>서점별 베스트 100</h2>
    <span class="note">탭으로 전환</span>
  </div>
  <div class="tabs" id="storeTabs"></div>
  <div id="storeBooks"></div>
</section>

<footer>
  <span>Bestseller Tracker · GitHub Actions로 매일 자동 수집</span>
  <span id="footerStats"></span>
</footer>

</div>

<script>
const DATA = null;
const STORE_LABELS = {kyobo: "교보문고", yes24: "예스24", aladin: "알라딘"};
const STORE_COLORS = {kyobo: "#c8451f", yes24: "#2d6a4f", aladin: "#3d5a80"};

function init() {
  if (!DATA) {
    document.querySelector('.wrap').innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다.<br>GitHub Actions가 처음 돌고 나면 여기에 결과가 나타납니다.</div>';
    return;
  }
  document.getElementById('latestDate').textContent = DATA.latest_date;
  document.getElementById('generatedAt').textContent = '생성: ' + DATA.generated_at;
  renderStats();
  renderCommon();
  renderUnique();
  renderTrend();
  renderStores();
}

function renderStats() {
  const s = DATA.stats;
  const commonCount = DATA.common.length;
  const html = `
    <div class="stat"><div class="label">Days Tracked</div><div class="value">${s.days}</div></div>
    <div class="stat"><div class="label">Total Records</div><div class="value">${s.rows.toLocaleString()}</div></div>
    <div class="stat"><div class="label">3사 공통 (오늘)</div><div class="value">${commonCount}</div></div>
    <div class="stat"><div class="label">Stores</div><div class="value">3</div></div>
  `;
  document.getElementById('stats').innerHTML = html;
  document.getElementById('footerStats').textContent = `${s.rows.toLocaleString()} rows · ${s.days} days`;
}

function renderCommon() {
  const c = DATA.common;
  if (!c.length) {
    document.getElementById('commonContainer').innerHTML = '<div class="empty">아직 3사 공통 상위권 책이 없습니다.</div>';
    return;
  }
  let rows = '';
  for (const b of c.slice(0, 30)) {
    const k = b.ranks.kyobo;
    const y = b.ranks.yes24;
    const a = b.ranks.aladin;
    rows += `
      <tr>
        <td class="rank-cell">${b.avg_rank.toFixed(1)}</td>
        <td class="book-title-cell">
          ${escapeHtml(b.title)}
          <div class="author">${escapeHtml(b.author || '')} · ${escapeHtml(b.publisher || '')}</div>
        </td>
        <td><span class="rank-pill ${k <= 10 ? 'top10' : ''}">${k}</span></td>
        <td><span class="rank-pill ${y <= 10 ? 'top10' : ''}">${y}</span></td>
        <td><span class="rank-pill ${a <= 10 ? 'top10' : ''}">${a}</span></td>
      </tr>
    `;
  }
  document.getElementById('commonContainer').innerHTML = `
    <table class="common-table">
      <thead>
        <tr>
          <th>평균순위</th>
          <th>도서</th>
          <th>교보</th>
          <th>예스24</th>
          <th>알라딘</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderUnique() {
  let html = '';
  for (const [store, books] of Object.entries(DATA.unique_by_store)) {
    const items = books.slice(0, 10).map(b => `
      <li>
        <span></span>
        <span>
          <div>${escapeHtml(b.title)} <span style="color:var(--muted)">· ${b.rank}위</span></div>
          <div class="uauthor">${escapeHtml(b.author || '')}</div>
        </span>
      </li>
    `).join('') || '<li><span></span><span style="color:var(--muted)">단독 등장 없음</span></li>';
    html += `
      <div class="unique-col">
        <h3 style="color:${STORE_COLORS[store]}">${STORE_LABELS[store]}</h3>
        <ol>${items}</ol>
      </div>
    `;
  }
  document.getElementById('uniqueContainer').innerHTML = html;
}

function renderStores() {
  const stores = Object.keys(STORE_LABELS);
  document.getElementById('storeTabs').innerHTML = stores.map((s, i) =>
    `<button class="tab ${i === 0 ? 'active' : ''}" data-store="${s}">${STORE_LABELS[s]}</button>`
  ).join('');

  function showStore(store) {
    const books = DATA.latest_by_store[store] || [];
    if (!books.length) {
      document.getElementById('storeBooks').innerHTML = '<div class="empty">데이터 없음</div>';
      return;
    }
    const html = books.map(b => `
      <div class="book-row">
        <div class="rank ${b.rank <= 10 ? 'top' : ''}">${b.rank}</div>
        <div class="info">
          <div class="title">${b.url ? `<a href="${escapeHtml(b.url)}" target="_blank" style="color:inherit;text-decoration:none">${escapeHtml(b.title)}</a>` : escapeHtml(b.title)}</div>
          <div class="meta-line">${escapeHtml(b.author || '')}${b.publisher ? ' · ' + escapeHtml(b.publisher) : ''}</div>
        </div>
        <div class="price">${b.price ? b.price.toLocaleString() + '원' : ''}</div>
      </div>
    `).join('');
    document.getElementById('storeBooks').innerHTML = `<div class="book-list">${html}</div>`;
  }

  document.querySelectorAll('#storeTabs .tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#storeTabs .tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showStore(btn.dataset.store);
    });
  });
  showStore(stores[0]);
}

let selectedTrendIdx = 0;
function renderTrend() {
  const trends = DATA.trend;
  if (!trends.length) {
    document.getElementById('trendChips').innerHTML = '<span style="color:var(--muted);font-size:13px">추이를 표시하려면 최소 2일 이상 수집이 필요합니다.</span>';
    return;
  }
  document.getElementById('trendChips').innerHTML = trends.map((t, i) =>
    `<button class="trend-chip ${i === 0 ? 'active' : ''}" data-idx="${i}" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</button>`
  ).join('');
  document.querySelectorAll('.trend-chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.trend-chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      selectedTrendIdx = parseInt(c.dataset.idx);
      drawTrend();
    });
  });
  drawTrend();
}

function drawTrend() {
  const canvas = document.getElementById('trendChart');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 320 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = 320;
  const padL = 50, padR = 24, padT = 20, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  ctx.clearRect(0, 0, W, H);

  const trend = DATA.trend[selectedTrendIdx];
  if (!trend) return;

  const dates = DATA.recent_dates;
  if (dates.length < 2) {
    ctx.fillStyle = '#7a6f63';
    ctx.font = "italic 14px 'Fraunces', serif";
    ctx.textAlign = 'center';
    ctx.fillText('최소 2일 이상의 데이터가 필요합니다', W/2, H/2);
    return;
  }

  // Y축: 1위가 위로 오도록 반전
  const yMax = 100, yMin = 1;
  const xStep = plotW / Math.max(1, dates.length - 1);

  // 격자
  ctx.strokeStyle = 'rgba(42,34,29,0.1)';
  ctx.lineWidth = 1;
  [1, 25, 50, 75, 100].forEach(r => {
    const y = padT + ((r - yMin) / (yMax - yMin)) * plotH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
    ctx.fillStyle = '#7a6f63';
    ctx.font = "11px 'IBM Plex Sans KR'";
    ctx.textAlign = 'right';
    ctx.fillText(r + '위', padL - 8, y + 4);
  });

  // X축 라벨
  dates.forEach((d, i) => {
    const x = padL + xStep * i;
    ctx.fillStyle = '#7a6f63';
    ctx.font = "10px 'IBM Plex Sans KR'";
    ctx.textAlign = 'center';
    ctx.fillText(d.slice(5), x, H - padB + 18);
  });

  // 라인
  for (const [store, points] of Object.entries(trend.series)) {
    const color = STORE_COLORS[store];
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let started = false;
    points.forEach(p => {
      const di = dates.indexOf(p.date);
      if (di < 0) return;
      const x = padL + xStep * di;
      const y = padT + ((p.rank - yMin) / (yMax - yMin)) * plotH;
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // 점
    points.forEach(p => {
      const di = dates.indexOf(p.date);
      if (di < 0) return;
      const x = padL + xStep * di;
      const y = padT + ((p.rank - yMin) / (yMax - yMin)) * plotH;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // 범례
  const legendY = padT + 8;
  let lx = padL + 12;
  Object.entries(trend.series).forEach(([store, _]) => {
    ctx.fillStyle = STORE_COLORS[store];
    ctx.fillRect(lx, legendY, 10, 10);
    ctx.fillStyle = '#1a1614';
    ctx.font = "500 12px 'IBM Plex Sans KR'";
    ctx.textAlign = 'left';
    ctx.fillText(STORE_LABELS[store], lx + 16, legendY + 9);
    lx += 100;
  });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.addEventListener('resize', () => { drawTrend(); });
init();
</script>
</body>
</html>
